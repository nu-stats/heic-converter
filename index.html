<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEIC Converter</title>
<meta name="description" content="Convert iPhone HEIC photos to JPG, PNG or WebP in your browser. Nothing is uploaded.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1f24;
    --muted: #5d6470;
    --line: #dfe2e7;
    --accent: #c8102e;
    --accent-text: #ffffff;
    --accent-soft: #fbe9ec;
    --ok: #1d7a46;
    --err: #b3261e;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --card: #1b1e24;
      --text: #e9ebef;
      --muted: #9aa1ad;
      --line: #2d323b;
      --accent: #ff4d63;
      --accent-text: #16181c;
      --accent-soft: #3a1d23;
      --ok: #5ccf8d;
      --err: #ff8a80;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .drop {
    display: block;
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 36px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop:focus-within, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { display: block; font-size: 18px; margin-bottom: 4px; }
  .drop span { color: var(--muted); font-size: 14px; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .settings {
    display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center;
    margin-top: 18px;
  }
  .settings label.title { font-size: 14px; color: var(--muted); margin-right: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label { padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .seg label:not(:first-of-type) { border-left: 1px solid var(--line); }
  .seg input:checked + label { background: var(--accent); color: var(--accent-text); }
  .seg input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
  .quality { display: flex; align-items: center; gap: 10px; }
  .quality input { width: 140px; accent-color: var(--accent); }
  .quality output { font-variant-numeric: tabular-nums; min-width: 3ch; font-weight: 600; }
  .quality.off { opacity: .4; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    margin: 24px 0 10px;
  }
  .bar .count { color: var(--muted); font-size: 14px; }
  .bar .actions { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 14px; font-weight: 600;
    border-radius: 9px; padding: 8px 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .45; cursor: default; }
  ul.files { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .file {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  }
  .thumb {
    width: 56px; height: 56px; border-radius: 8px; object-fit: cover;
    background: var(--line); display: block;
  }
  .meta { min-width: 0; }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 13px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .file a.dl {
    font-size: 14px; font-weight: 600; text-decoration: none; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 9px; padding: 6px 12px; white-space: nowrap;
  }
  .file a.dl[aria-disabled="true"] { opacity: .35; pointer-events: none; }
  .note { color: var(--muted); font-size: 13px; margin-top: 28px; }
  .note a { color: inherit; }
  [hidden] { display: none !important; }
  @media (max-width: 480px) {
    h1 { font-size: 24px; }
    .file { grid-template-columns: 48px 1fr; }
    .thumb { width: 48px; height: 48px; }
    .file a.dl { grid-column: 2; justify-self: start; }
  }
</style>
</head>
<body>
<main>
  <h1>HEIC Converter</h1>
  <p class="lede">Turn iPhone photos (.heic) into JPG, PNG or WebP. Everything happens in your browser &mdash; your photos are never uploaded.</p>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="picker" multiple accept=".heic,.heif,image/heic,image/heif,image/*">
      <strong>Drop photos here or click to choose</strong>
      <span>HEIC and HEIF files (JPG, PNG and WebP also work). Pick as many as you like.</span>
    </label>

    <div class="settings">
      <div>
        <label class="title" id="format-label">Convert to</label>
        <div class="seg" role="radiogroup" aria-labelledby="format-label">
          <input type="radio" name="format" id="f-jpg" value="image/jpeg" checked><label for="f-jpg">JPG</label>
          <input type="radio" name="format" id="f-png" value="image/png"><label for="f-png">PNG</label>
          <input type="radio" name="format" id="f-webp" value="image/webp"><label for="f-webp">WebP</label>
        </div>
      </div>
      <div class="quality" id="quality-box">
        <label class="title" for="quality">Quality</label>
        <input type="range" id="quality" min="50" max="100" step="1" value="92">
        <output id="quality-out" for="quality">92</output>
      </div>
    </div>
  </div>

  <div class="bar" id="bar" hidden>
    <span class="count" id="count"></span>
    <div class="actions">
      <button type="button" id="clear">Clear</button>
      <button type="button" class="primary" id="zip" disabled>Download all (.zip)</button>
    </div>
  </div>
  <ul class="files" id="files"></ul>

  <p class="note">
    Converted copies don't carry the original photo's location or camera data.
    Built with <a href="https://github.com/hoppergee/heic-to">heic-to</a> (libheif) and <a href="https://stuk.github.io/jszip/">JSZip</a>.
  </p>
</main>
<script src="vendor/heic-to.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
